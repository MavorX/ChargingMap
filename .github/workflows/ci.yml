name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_AMAP_KEY: dummy_key_for_ci
      VITE_AMAP_SECURITY_CODE: dummy_code_for_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test -- --run

      - run: npm run build
